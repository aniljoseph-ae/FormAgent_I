# config/config.yaml

system:
  name: "RAG-Augmented Agentic Document AI System"
  version: "1.0.0"
  log_level: "INFO"

llm:
  provider: "groq"
  model: "llama-3.1-8b-instant"
  api_key: "${GROQ_API_KEY}"
  temperature: 0.1
  max_tokens: 2048

embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  batch_size: 32

vector_store:
  type: "chroma"
  persist_directory: "./data/chroma_db"
  collection_name: "document_chunks"

rag_config:
  chunk_size: 512
  chunk_overlap: 50
  max_chunks_per_doc: 100
  top_k: 5
  similarity_threshold: 0.7
  enable_hybrid_search: true

agent:
  max_iterations: 5
  enable_reflection: true
  timeout_seconds: 30

evaluation:
  ragas:
    metrics:
      - "answer_relevancy"
      - "context_precision"
      - "faithfulness"
      - "context_recall"
  deepeval:
    metrics:
      - "AnswerRelevancyMetric"
      - "FaithfulnessMetric"
      - "ContextualRecallMetric"
      - "ContextualPrecisionMetric"
  evaluation_model: "llama-3.1-8b-instant"
  evaluation_api_key: "${GROQ_API_KEY}"

paths:
  data_directory: "./data"
  evaluations_directory: "./evaluations"
  logs_directory: "./logs"